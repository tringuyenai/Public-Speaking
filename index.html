    <script>

            darkMode: 'class',

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; user-select: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }

        .speech-text-sm { font-size: 1.25rem; line-height: 2rem; }
        .speech-text-md { font-size: 1.75rem; line-height: 2.75rem; }
        .speech-text-lg { font-size: 2.25rem; line-height: 3.5rem; }
        .speech-text-xl { font-size: 2.75rem; line-height: 4rem; }

        .teleprompter-line {
            position: absolute; top: 35%; left: 0; right: 0; height: 30%;
            border-top: 2px dashed rgba(239, 68, 68, 0.4);
            border-bottom: 2px dashed rgba(239, 68, 68, 0.4);
            pointer-events: none; background: rgba(239, 68, 68, 0.02); z-index: 10;
        }
        .mirror-mode { transform: scaleX(-1); }
        .slide-enter { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

                        <option value="topic15">Topic 15: Social Media on Mental Health</option>

        <div id="card-view" class="flex-1 flex flex-col justify-between overflow-hidden">
            <div id="main-slide-card" class="slide-enter flex-1 bg-darkcard/80 border border-slate-800 rounded-2xl p-6 md:p-8 flex flex-col relative overflow-hidden">
                
                <div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                    <div class="flex items-center space-x-3">
                        <span id="slide-number-tag" class="w-10 h-10 rounded-xl bg-indigo-600 text-white font-extrabold flex items-center justify-center text-lg">1</span>

                            <p id="slide-subtitle" class="text-sm text-indigo-400 font-medium">Subtitle</p>
                        </div>
                    </div>

                </div>

                <!-- Reading Area -->
                <div class="flex-1 overflow-y-auto pr-2 pb-16">
                    <div id="speech-content-box" class="space-y-4 select-text">
                        <!-- Sentences go here -->
                    </div>
                </div>

                <div class="absolute bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-darkcard via-darkcard to-transparent border-t border-slate-800 flex items-center justify-between mt-auto">
                    <button id="prev-slide-btn" onclick="prevSlide()" class="px-6 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm disabled:opacity-30">

                    <button id="next-slide-btn" onclick="nextSlide()" class="px-6 py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm disabled:opacity-30">
                        Tiếp theo <i class="fa-solid fa-chevron-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="prompter-view" class="hidden flex-1 flex-col relative overflow-hidden">
            <div class="bg-darkcard border border-slate-800 p-2 rounded-xl mb-3 flex items-center justify-between">

                    <!-- Script injected here -->
                </div>
            </div>
        </div>
    </main>

                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello teacher.", "My topic is how to overcome the fear of public speaking.", "It is the number one fear in the world.", "I will share two mental tricks."], textVN: ["Chào thầy cô.", "Chủ đề của em là cách vượt qua nỗi sợ thuyết trình.", "Đó là nỗi sợ số một trên thế giới.", "Em sẽ chia sẻ 2 mẹo tâm lý."] },
                    { num: 2, title: "Body 1", sub: "Thay đổi suy nghĩ", time: "~40s", textEN: ["First, change how you think.", "Do not think it is a test.", "Think it is just sharing a story with friends.", "If you make a mistake, nobody will kill you."], textVN: ["Đầu tiên, thay đổi cách bạn nghĩ.", "Đừng nghĩ đây là bài kiểm tra.", "Hãy nghĩ đó chỉ là chia sẻ câu chuyện với bạn bè.", "Nếu bạn mắc lỗi, không ai giết bạn đâu."] },
                    { num: 3, title: "Body 2", sub: "Chấp nhận sự run rẩy", time: "~40s", textEN: ["Second, accept that you are nervous.", "It is normal for your hands to shake.", "Tell yourself: 'I am excited, not scared'.", "Use that energy to speak louder."], textVN: ["Thứ hai, chấp nhận rằng bạn đang run.", "Tay bị run là chuyện bình thường.", "Hãy nói với bản thân: 'Mình đang phấn khích, không phải sợ'.", "Dùng năng lượng đó để nói to hơn."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["To sum up, think positively and accept your nervous energy.", "Speaking is sharing, not performing.", "Be brave.", "Thank you."], textVN: ["Tóm lại, nghĩ tích cực và chấp nhận sự hồi hộp.", "Nói là chia sẻ, không phải biểu diễn.", "Hãy dũng cảm.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] What if you forget the script?", "-> Answer: I will look at my cue cards.", "[CÂU HỎI 2] Does eye contact help?", "-> Answer: Yes, looking at kind people helps me relax."], textVN: ["[CÂU HỎI 1] Nếu bạn quên kịch bản thì sao?", "-> Trả lời: Tôi sẽ nhìn vào thẻ gợi ý.", "[CÂU HỎI 2] Giao tiếp mắt có giúp ích không?", "-> Trả lời: Có, nhìn người hiền lành giúp tôi thư giãn."] }

                topic17: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello everyone.", "Today I will talk about Online Learning vs Traditional Classroom.", "Since COVID-19, online learning is everywhere.", "I will compare their flexibility and quality."], textVN: ["Chào mọi người.", "Hôm nay tôi sẽ nói về Học online vs Lớp truyền thống.", "Từ đợt COVID-19, học online ở khắp nơi.", "Tôi sẽ so sánh sự linh hoạt và chất lượng của chúng."] },
                    { num: 2, title: "Body 1", sub: "Sự linh hoạt", time: "~40s", textEN: ["First, online learning is super flexible.", "You can record the lesson and watch it again.", "You can study while drinking coffee at a cafe.", "It saves a lot of time."], textVN: ["Đầu tiên, học online siêu linh hoạt.", "Bạn có thể ghi hình bài và xem lại.", "Bạn có thể học khi đang uống cafe ở quán.", "Nó tiết kiệm rất nhiều thời gian."] },
                    { num: 3, title: "Body 2", sub: "Chất lượng thực hành", time: "~40s", textEN: ["Second, traditional learning has better quality for practice.", "If you study medicine or chemistry, you need a real lab.", "You cannot do experiments on a computer screen.", "Real classes are a must for these majors."], textVN: ["Thứ hai, học truyền thống có chất lượng thực hành tốt hơn.", "Nếu học y hoặc hóa, bạn cần phòng thí nghiệm thật.", "Bạn không thể làm thí nghiệm trên màn hình máy tính.", "Lớp thật là bắt buộc cho các ngành này."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["In conclusion, online is flexible but traditional is better for practice.", "The best way is to combine both.", "Thank you."], textVN: ["Tóm lại, online thì linh hoạt nhưng truyền thống tốt hơn để thực hành.", "Cách tốt nhất là kết hợp cả hai.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] Is online learning cheaper?", "-> Answer: Yes, because you don't pay for school electricity.", "[CÂU HỎI 2] Can you make friends online?", "-> Answer: Yes, but it is not as deep as real life."], textVN: ["[CÂU HỎI 1] Học online có rẻ hơn không?", "-> Trả lời: Có, vì bạn không trả tiền điện cho trường.", "[CÂU HỎI 2] Bạn có thể kết bạn online không?", "-> Trả lời: Có, nhưng không sâu sắc bằng ngoài đời."] }
                ],
                topic18: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello teacher.", "My topic today is the importance of learning English.", "It is the bridge to the world.", "I will talk about technology and understanding."], textVN: ["Chào thầy cô.", "Chủ đề của em hôm nay là tầm quan trọng của học tiếng Anh.", "Nó là cây cầu ra thế giới.", "Em sẽ nói về công nghệ và sự thấu hiểu."] },
                    { num: 2, title: "Body 1", sub: "Công nghệ", time: "~40s", textEN: ["First, English is the language of technology.", "All programming codes and software are in English.", "If you want to be an IT engineer, you must know it.", "It keeps you updated with the future."], textVN: ["Đầu tiên, tiếng Anh là ngôn ngữ của công nghệ.", "Mọi mã lập trình và phần mềm đều bằng tiếng Anh.", "Nếu muốn làm kỹ sư IT, bạn phải biết nó.", "Nó giữ bạn cập nhật với tương lai."] },
                    { num: 3, title: "Body 2", sub: "Thấu hiểu toàn cầu", time: "~40s", textEN: ["Second, it brings global understanding.", "We can read news from CNN or BBC directly.", "We know what is happening in the world without translation.", "It makes us global citizens."], textVN: ["Thứ hai, nó mang lại sự thấu hiểu toàn cầu.", "Ta có thể đọc tin từ CNN hay BBC trực tiếp.", "Ta biết chuyện gì đang xảy ra trên TG mà không cần dịch.", "Nó làm ta thành công dân toàn cầu."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["To sum up, English is needed for technology and world knowledge.", "It makes you smarter and connected.", "Learn it with passion.", "Thank you."], textVN: ["Tóm lại, tiếng Anh cần cho công nghệ và kiến thức thế giới.", "Nó làm bạn thông minh và được kết nối.", "Hãy học nó với đam mê.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] Will AI translation make learning English useless?", "-> Answer: No, talking to real people needs real emotion.", "[CÂU HỎI 2] How often do you practice English?", "-> Answer: I practice a little bit every evening."], textVN: ["[CÂU HỎI 1] AI dịch thuật có làm việc học TA vô ích không?", "-> Trả lời: Không, nói chuyện với người thật cần cảm xúc thật.", "[CÂU HỎI 2] Bạn luyện TA thường xuyên thế nào?", "-> Trả lời: Tôi luyện một chút mỗi buổi tối."] }
                ],
                topic19: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello everyone.", "Today I will discuss how technology is changing communication.", "We are more connected but also more isolated.", "I will explain this."], textVN: ["Chào mọi người.", "Hôm nay tôi sẽ thảo luận công nghệ thay đổi giao tiếp ra sao.", "Ta được kết nối nhiều hơn nhưng cũng cô lập hơn.", "Tôi sẽ giải thích điều này."] },
                    { num: 2, title: "Body 1", sub: "Khoảng cách biến mất", time: "~40s", textEN: ["First, distance is not a problem anymore.", "My sister lives in Australia, but I see her every day on Zoom.", "We can share pictures instantly.", "The world is like a small village."], textVN: ["Đầu tiên, khoảng cách không còn là vấn đề nữa.", "Chị tôi sống ở Úc, nhưng tôi thấy chị mỗi ngày trên Zoom.", "Chúng tôi có thể chia sẻ ảnh ngay lập tức.", "Thế giới giống như một ngôi làng nhỏ."] },
                    { num: 3, title: "Body 2", sub: "Mất cảm xúc", time: "~40s", textEN: ["Second, written text has no emotion.", "When we text, people cannot see our face or hear our voice.", "A joke can become an insult.", "It creates many misunderstandings."], textVN: ["Thứ hai, văn bản viết không có cảm xúc.", "Khi nhắn tin, người ta không thấy mặt hay nghe giọng ta.", "Một trò đùa có thể thành lời xúc phạm.", "Nó tạo ra nhiều sự hiểu lầm."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["In conclusion, technology makes communication global but removes emotions.", "Use emojis or make a call when it is important.", "Thank you."], textVN: ["Tóm lại, công nghệ làm giao tiếp toàn cầu nhưng xóa đi cảm xúc.", "Hãy dùng emoji hoặc gọi điện khi có việc quan trọng.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] What app do you use to communicate?", "-> Answer: I use Zalo and Messenger.", "[CÂU HỎI 2] Have you ever misunderstood a text?", "-> Answer: Yes, I thought my friend was angry but she was just busy."], textVN: ["[CÂU HỎI 1] Bạn dùng app nào để giao tiếp?", "-> Trả lời: Tôi dùng Zalo và Messenger.", "[CÂU HỎI 2] Bạn từng hiểu lầm tin nhắn chưa?", "-> Trả lời: Có, tôi tưởng bạn tôi giận nhưng cô ấy chỉ đang bận."] }
                ],
                topic20: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello teacher.", "My topic is the importance of Critical Thinking.", "It means you don't accept everything blindly.", "I will talk about creativity and independence."], textVN: ["Chào thầy cô.", "Chủ đề của em là tầm quan trọng của Tư duy phản biện.", "Nó nghĩa là bạn không chấp nhận mọi thứ mù quáng.", "Em sẽ nói về sự sáng tạo và độc lập."] },
                    { num: 2, title: "Body 1", sub: "Sự sáng tạo", time: "~40s", textEN: ["First, it builds creativity.", "Critical thinkers always ask: 'Is there a better way?'", "They invent new tools and ideas.", "They do not follow the boring old rules."], textVN: ["Đầu tiên, nó xây dựng sự sáng tạo.", "Người có tư duy phản biện luôn hỏi: 'Có cách nào tốt hơn không?'", "Họ phát minh công cụ và ý tưởng mới.", "Họ không làm theo những luật lệ cũ nhàm chán."] },
                    { num: 3, title: "Body 2", sub: "Sự độc lập", time: "~40s", textEN: ["Second, it makes you independent.", "You don't need your parents to tell you what is right or wrong.", "You analyze the problem yourself.", "You take control of your own life."], textVN: ["Thứ hai, nó làm bạn độc lập.", "Bạn không cần cha mẹ bảo cái gì đúng sai.", "Bạn tự phân tích vấn đề.", "Bạn kiểm soát cuộc đời của chính mình."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["To sum up, critical thinking makes you creative and independent.", "It is the best weapon for a student.", "Use your brain deeply.", "Thank you."], textVN: ["Tóm lại, tư duy phản biện làm bạn sáng tạo và độc lập.", "Đó là vũ khí tốt nhất cho sinh viên.", "Hãy dùng não của bạn thật sâu.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] Can critical thinking make you look arrogant?", "-> Answer: Only if you argue rudely. We must be polite.", "[CÂU HỎI 2] How to teach kids to think critically?", "-> Answer: Ask them 'Why?' often."], textVN: ["[CÂU HỎI 1] Tư duy phản biện có làm bạn trông kiêu ngạo không?", "-> Trả lời: Chỉ khi bạn cãi thô lỗ. Ta phải lịch sự.", "[CÂU HỎI 2] Làm sao dạy trẻ em tư duy phản biện?", "-> Trả lời: Hỏi chúng 'Tại sao?' thường xuyên."] }
                ],
                topic21: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello everyone.", "Today I will discuss if university attendance should be mandatory.", "Many students skip classes.", "I will look at the value of lectures and self-study."], textVN: ["Chào mọi người.", "Hôm nay tôi sẽ thảo luận liệu đi học đại học có nên bắt buộc.", "Nhiều sinh viên cúp học.", "Tôi sẽ xem xét giá trị bài giảng và tự học."] },
                    { num: 2, title: "Body 1", sub: "Giá trị lớp học", time: "~40s", textEN: ["First, going to class has a unique value.", "Teachers give tips that are not in the book.", "You can discuss with classmates.", "This interactive environment cannot be replaced."], textVN: ["Đầu tiên, đến lớp có giá trị độc nhất.", "Giáo viên cho mẹo không có trong sách.", "Bạn có thể thảo luận với bạn cùng lớp.", "Môi trường tương tác này không thể thay thế."] },
                    { num: 3, title: "Body 2", sub: "Sinh viên đi làm", time: "~40s", textEN: ["But second, many students must work to pay fee.", "If attendance is mandatory, they will lose their jobs.", "Some students are smart enough to study at home and pass.", "They need flexibility."], textVN: ["Nhưng thứ hai, nhiều SV phải đi làm trả học phí.", "Nếu bắt buộc đi học, họ sẽ mất việc.", "Vài SV đủ thông minh để tự học ở nhà và qua môn.", "Họ cần sự linh hoạt."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["In conclusion, attendance is good but should not be forced 100%.", "Universities should reward students who attend, not punish those who don't.", "Thank you."], textVN: ["Tóm lại, đi học là tốt nhưng không nên ép 100%.", "Đại học nên thưởng người đi học, không phạt người vắng.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] Do you think rolling call wastes time?", "-> Answer: Yes, it takes 15 minutes of the class.", "[CÂU HỎI 2] Should attendance be 50% of the grade?", "-> Answer: No, exams are more important."], textVN: ["[CÂU HỎI 1] Bạn có nghĩ điểm danh tốn thời gian không?", "-> Trả lời: Có, nó tốn 15 phút của lớp.", "[CÂU HỎI 2] Điểm chuyên cần có nên chiếm 50% điểm không?", "-> Trả lời: Không, bài thi quan trọng hơn."] }
                ],
                topic22: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello teacher.", "My topic today is the influence of influencers.", "They have millions of followers.", "I will focus on lifestyle and mental health impacts."], textVN: ["Chào thầy cô.", "Chủ đề của em hôm nay là ảnh hưởng của influencer.", "Họ có hàng triệu người theo dõi.", "Em sẽ tập trung vào tác động lối sống và tâm lý."] },
                    { num: 2, title: "Body 1", sub: "Định hình lối sống", time: "~40s", textEN: ["First, they shape how young people live.", "If an influencer promotes green living, followers will stop using plastic.", "They have the power to create good social movements.", "They spread good messages quickly."], textVN: ["Đầu tiên, họ định hình cách người trẻ sống.", "Nếu influencer ủng hộ sống xanh, người theo dõi sẽ ngừng dùng nhựa.", "Họ có quyền lực tạo ra phong trào xã hội tốt.", "Họ lan truyền thông điệp tốt nhanh chóng."] },
                    { num: 3, title: "Body 2", sub: "Lối sống ảo", time: "~40s", textEN: ["Second, they can create fake standards.", "They post pictures of expensive cars and luxury bags.", "Young people feel poor and stressed.", "Some even borrow money to live like their idols."], textVN: ["Thứ hai, họ có thể tạo tiêu chuẩn ảo.", "Họ đăng ảnh siêu xe và túi hàng hiệu.", "Người trẻ thấy nghèo và áp lực.", "Vài người thậm chí vay tiền để sống như thần tượng."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["To sum up, influencers can lead us to good habits or fake dreams.", "Choose who you follow carefully.", "Don't lose your true self.", "Thank you."], textVN: ["Tóm lại, influencer có thể dẫn ta đến thói quen tốt hoặc giấc mơ ảo.", "Hãy chọn người để theo dõi cẩn thận.", "Đừng đánh mất bản thân thực sự.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] Do you want to be an influencer?", "-> Answer: No, I want a quiet and private life.", "[CÂU HỎI 2] Why do brands use influencers?", "-> Answer: Because they can sell products very fast."], textVN: ["[CÂU HỎI 1] Bạn có muốn làm influencer không?", "-> Trả lời: Không, tôi muốn cuộc sống yên tĩnh và riêng tư.", "[CÂU HỎI 2] Sao các nhãn hàng dùng influencer?", "-> Trả lời: Vì họ có thể bán hàng rất nhanh."] }
                ],
                topic23: [
                    { num: 1, title: "Intro", sub: "Mở đầu", time: "~30s", textEN: ["Hello everyone.", "Today I will talk about how to build good habits.", "Our habits define our future.", "I will share the rule of environment and consistency."], textVN: ["Chào mọi người.", "Hôm nay tôi sẽ nói về cách xây dựng thói quen tốt.", "Thói quen định hình tương lai chúng ta.", "Tôi sẽ chia sẻ quy tắc môi trường và sự kiên trì."] },
                    { num: 2, title: "Body 1", sub: "Thay đổi môi trường", time: "~40s", textEN: ["First, change your environment.", "If you want to read, put a book on your pillow.", "If you want to diet, throw away all the candy.", "Make the good habits easy to see and do."], textVN: ["Đầu tiên, thay đổi môi trường của bạn.", "Nếu muốn đọc, hãy để sách trên gối.", "Nếu muốn ăn kiêng, vứt hết kẹo đi.", "Hãy làm cho thói quen tốt dễ thấy và dễ làm."] },
                    { num: 3, title: "Body 2", sub: "Kiên trì vượt qua khó khăn", time: "~40s", textEN: ["Second, be consistent when it is hard.", "The first week is always terrible.", "Your brain will tell you to stop.", "You must fight it and do it anyway.", "Only consistency builds habits."], textVN: ["Thứ hai, kiên trì khi gặp khó khăn.", "Tuần đầu tiên luôn luôn tồi tệ.", "Não bạn sẽ bảo bạn dừng lại.", "Bạn phải chiến đấu với nó và cứ làm.", "Chỉ có sự kiên trì mới xây dựng được thói quen."] },
                    { num: 4, title: "Conclusion", sub: "Kết luận", time: "~30s", textEN: ["In conclusion, setup your environment and never give up in the first week.", "Small daily habits build a great life.", "Start today.", "Thank you."], textVN: ["Tóm lại, thiết lập môi trường và không bỏ cuộc tuần đầu.", "Thói quen nhỏ hàng ngày xây cuộc sống tuyệt vời.", "Bắt đầu ngay hôm nay.", "Cảm ơn."] },
                    { num: 5, title: "Q&A Predictions", sub: "Dự đoán Q&A", time: "~1m", textEN: ["[CÂU HỎI 1] What habit do you want to build now?", "-> Answer: I want to wake up at 5 AM.", "[CÂU HỎI 2] How many days does it take to form a habit?", "-> Answer: People say it takes 21 days."], textVN: ["[CÂU HỎI 1] Bạn muốn xây thói quen gì bây giờ?", "-> Trả lời: Tôi muốn dậy lúc 5 giờ sáng.", "[CÂU HỎI 2] Tốn bao nhiêu ngày để hình thành thói quen?", "-> Trả lời: Người ta nói tốn 21 ngày."] }
                ],
                topic24: [

        let currentSlideIdx = 0;

        const fontClasses = ['speech-text-sm', 'speech-text-md', 'speech-text-lg', 'speech-text-xl'];

        function initApp() {
            updateTabs();
            renderSlide();
        }

        // Đổi ngôn ngữ EN / VN
        function toggleLang() {
            currentLang = currentLang === 'EN' ? 'VN' : 'EN';
            const langText = document.getElementById('lang-text');
            if (currentLang === 'EN') {
                langText.innerText = "Dịch VN";
            } else {
                langText.innerText = "Hiện EN";
            }
            renderSlide();
        }

        // Lấy dữ liệu an toàn, nếu Topic chưa có nội dung sẽ hiển thị báo lỗi thay vì crash App
        function getSlidesData() {
            if (db[currentSpeaker] && db[currentSpeaker][currentTopic]) {
                return db[currentSpeaker][currentTopic];
            }
            return [
                { num: 1, title: "Cần Cập Nhật", sub: "Missing Data", time: "~0s",

                }
            ];
        }

            currentSpeaker = speaker;
            currentSlideIdx = 0;
            updateTabs();
            renderSlide();
        }

        function changeTopic() {
            currentTopic = document.getElementById('topic-selector').value;
            currentSlideIdx = 0;
            renderSlide();
        }

            const camBtn = document.getElementById('tab-cam');
            const dungBtn = document.getElementById('tab-dung');
            
            if(currentSpeaker === 'cam') {
                camBtn.className = "flex-1 md:flex-none px-6 py-2 rounded-lg font-bold text-sm transition-all bg-indigo-600 text-white shadow-md";

            } else {
                dungBtn.className = "flex-1 md:flex-none px-6 py-2 rounded-lg font-bold text-sm transition-all bg-emerald-600 text-white shadow-md";
                camBtn.className = "flex-1 md:flex-none px-6 py-2 rounded-lg font-bold text-sm transition-all text-slate-400 hover:text-white hover:bg-slate-800";
            }
        }

        function renderSlide() {
            if (viewMode === 'prompter') {
                renderPrompter();
                return;
            }

            const slides = getSlidesData();
            const slide = slides[currentSlideIdx];

            // Animation Reset
            const card = document.getElementById('main-slide-card');
            card.classList.remove('slide-enter');
            void card.offsetWidth;
            card.classList.add('slide-enter');

            // Header Update
            document.getElementById('slide-number-tag').innerText = slide.num;
            document.getElementById('slide-title').innerText = slide.title;
            document.getElementById('slide-subtitle').innerText = slide.sub;
            document.getElementById('slide-timing').innerText = slide.time;
            
            // Content Update

            if (sentences) {
                sentences.forEach(sentence => {
                    // Căn chỉnh màu đặc biệt cho phần Q&A
                    const isQA = sentence.includes("[CÂU HỎI") || sentence.includes("->");
                    const colorClass = isQA ? (sentence.includes("[CÂU HỎI") ? "text-amber-400" : "text-emerald-400") : "text-slate-100";
                    
                    const line = document.createElement('div');
                    line.className = `${fontClasses[fontSizeIdx]} font-medium ${colorClass} tracking-wide py-2 flex items-start space-x-3 border-b border-slate-800/50 last:border-0`;
                    line.innerHTML = `<span class="text-indigo-400 font-bold select-none text-xl mt-1.5">•</span><span>${sentence}</span>`;
                    box.appendChild(line);
                });
            }

            // Nav Update
            document.getElementById('current-slide-index').innerText = currentSlideIdx + 1;
            document.getElementById('total-slides-indicator').innerText = slides.length;
            document.getElementById('prev-slide-btn').disabled = currentSlideIdx === 0;
            document.getElementById('next-slide-btn').disabled = currentSlideIdx === slides.length - 1;
        }

        function renderPrompter() {
            const slides = getSlidesData();
            const box = document.getElementById('prompter-scroll-box');
            box.innerHTML = '';

            slides.forEach(slide => {
                const block = document.createElement('div');
                block.className = "py-8 border-b border-slate-800 last:border-0";
                
                const sentences = currentLang === 'EN' ? slide.textEN : slide.textVN;
                
                let sentencesHtml = "";
                if (sentences) {
                    sentencesHtml = sentences.map(s => {
                        const isQA = s.includes("[CÂU HỎI") || s.includes("->");
                        const colorClass = isQA ? (s.includes("[CÂU HỎI") ? "text-amber-400" : "text-emerald-400") : "text-slate-100";
                        return `
                        <div class="${fontClasses[fontSizeIdx]} font-medium ${colorClass} py-2.5 flex items-start space-x-3">
                            <span class="text-indigo-400 font-bold select-none text-xl mt-1.5">•</span><span>${s}</span>
                        </div>
                        `
                    }).join('');
                }

                block.innerHTML = `
                    <div class="mb-4 flex items-center space-x-3">
                        <span class="px-3 py-1 bg-indigo-600 text-white rounded text-xs font-bold">Slide ${slide.num}</span>
                        <span class="text-sm font-semibold text-slate-400">${slide.title}</span>
                    </div>
                    <div class="space-y-1">${sentencesHtml}</div>
                `;
                box.appendChild(block);
            });
        }

        function nextSlide() {
            const slides = getSlidesData();
            if (currentSlideIdx < slides.length - 1) { currentSlideIdx++; renderSlide(); }
        }

        function prevSlide() {
            if (currentSlideIdx > 0) { currentSlideIdx--; renderSlide(); }
        }

        function setViewMode(mode) {
            viewMode = mode;
            const cBtn = document.getElementById('mode-card-btn');
            const pBtn = document.getElementById('mode-prompter-btn');
            
            if (mode === 'card') {
                document.getElementById('card-view').classList.replace('hidden', 'flex');
                document.getElementById('prompter-view').classList.replace('flex', 'hidden');
                cBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow";
                pBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800";
                renderSlide();
            } else {
                document.getElementById('card-view').classList.replace('flex', 'hidden');
                document.getElementById('prompter-view').classList.replace('hidden', 'flex');
                pBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 text-white shadow";
                cBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white hover:bg-slate-800";
                renderPrompter();
            }
        }

        function changeFontSize(dir) {
            fontSizeIdx = Math.max(0, Math.min(3, fontSizeIdx + dir));
            renderSlide();
        }

        // Timer
        let timerInt = null, seconds = 0, isTimer = false;
        function toggleTimer() {
            const icon = document.getElementById('timer-icon');
            if (isTimer) {
                clearInterval(timerInt); isTimer = false; icon.className = "fa-solid fa-play";
            } else {
                isTimer = true; icon.className = "fa-solid fa-pause";
                timerInt = setInterval(() => {
                    seconds++;
                    const m = String(Math.floor(seconds/60)).padStart(2,'0');
                    const s = String(seconds%60).padStart(2,'0');
                    document.getElementById('timer-display').innerText = `${m}:${s}`;
                }, 1000);
            }
        }
        function resetTimer() {
            clearInterval(timerInt); isTimer = false; seconds = 0;
            document.getElementById('timer-icon').className = "fa-solid fa-play";
            document.getElementById('timer-display').innerText = "00:00";
        }

        // Prompter Auto-Scroll
        let scrollInt = null, isScroll = false, speed = 3;
        function toggleAutoScroll() {
            const box = document.getElementById('prompter-scroll-box');
            const icon = document.getElementById('scroll-icon');
            if (isScroll) {
                clearInterval(scrollInt); isScroll = false;
                icon.className = "fa-solid fa-play";
                document.getElementById('scroll-btn-text').innerText = "Cuộn tự động";
            } else {
                isScroll = true; icon.className = "fa-solid fa-pause";
                document.getElementById('scroll-btn-text').innerText = "Tạm dừng";
                scrollInt = setInterval(() => {
                    box.scrollTop += speed;
                    if(box.scrollTop + box.clientHeight >= box.scrollHeight) toggleAutoScroll();
                }, 50);
            }
        }
        function updateScrollSpeed() { speed = parseInt(document.getElementById('scroll-speed').value); }
        function toggleMirrorMode() { document.getElementById('prompter-scroll-box').classList.toggle('mirror-mode'); }

        window.addEventListener('keydown', (e) => {
            if (viewMode !== 'card') return;
            if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextSlide(); }
            else if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        });

        window.onload = initApp;
    </script>
</body>
</html>
